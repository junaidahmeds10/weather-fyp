<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Center - FYP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="light-theme">
    <div class="dashboard-container">
        
        <!-- Top App Bar -->
        <header class="top-nav">
            <div class="user-greeting">
                <span class="subtitle">Welcome home,</span>
                <h1 class="user-name" id="displayCity">Junaid Ahmed • Karachi</h1>
            </div>
            <div class="nav-actions">
                <div class="search-box-inline">
                    <input type="text" id="cityInput" placeholder="Search city...">
                    <button id="searchBtn">Search</button>
                </div>
                <button id="themeToggleBtn" class="icon-btn" title="Toggle Theme">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
                </button>
            </div>
        </header>

        <!-- Main Responsive Grid Layout -->
        <div class="main-grid">
            
            <!-- Left Column (Main Temp & Metrics) -->
            <div class="left-column">
                <section class="main-card">
                    <div class="main-info">
                        <span class="date-text" id="currentDate">14 November 2026</span>
                        <p class="condition-text" id="weatherCondition">Cloudy</p>
                        <div class="temp-display" id="mainTemp">18°C</div>
                    </div>
                    <div class="weather-illustration">
                        <svg width="90" height="70" viewBox="0 0 100 80" fill="none">
                            <circle cx="65" cy="30" r="16" fill="#FFB800"/>
                            <circle cx="85" cy="18" r="2" fill="#FFB800"/>
                            <circle cx="88" cy="32" r="2.5" fill="#FFB800"/>
                            <circle cx="78" cy="46" r="1.8" fill="#FFB800"/>
                            <path d="M28 62H70C77.732 62 84 55.732 84 48C84 40.669 78.363 34.656 71.183 34.051C68.675 24.819 60.244 18 50.2 18C38.16 18 28.4 27.76 28.4 39.8C28.4 40.23 28.413 40.657 28.438 41.081C21.976 42.398 17 48.121 17 55C17 58.866 20.134 62 24 62H28Z" class="cloud-fill"/>
                        </svg>
                    </div>
                </section>

                <section class="metrics-card">
                    <div class="metric-item">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M17.7 7.7a2.5 2.5 0 1 1 1.8 4.3H2"/><path d="M9.6 4.6A2 2 0 1 1 11 8H2"/><path d="M12.6 19.4A2 2 0 1 0 14 16H2"/></svg>
                        <strong id="windVal">10 m/s</strong>
                        <span>Wind</span>
                    </div>
                    <div class="metric-item">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg>
                        <strong id="humidityVal">98%</strong>
                        <span>Humidity</span>
                    </div>
                    <div class="metric-item">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 16.2A4.5 4.5 0 0 0 17.5 8h-1.8A7 7 0 1 0 4 14.9"/><path d="M16 14v6"/><path d="M8 14v6"/><path d="M12 16v6"/></svg>
                        <strong id="rainVal">100%</strong>
                        <span>Rain</span>
                    </div>
                </section>

                <!-- Forecast Tabs & Hourly -->
                <div class="forecast-section">
                    <nav class="forecast-tabs">
                        <button class="tab-btn active" data-tab="today">Today</button>
                        <button class="tab-btn" data-tab="tomorrow">Tomorrow</button>
                        <button class="tab-btn" data-tab="next3">Next 3 Days</button>
                    </nav>
                    <section class="hourly-grid" id="hourlyGrid"></section>
                </div>
            </div>

            <!-- Right Column (Temperature Graph Widget) -->
            <div class="right-column">
                <div class="widget-card">
                    <h3 class="widget-title">Temperature Graph</h3>
                    <div class="hourly-grid mini-grid" id="miniHourlyGrid"></div>
                    <div class="chart-container">
                        <div class="chart-tooltip" id="chartTooltip">
                            <span class="tooltip-time" id="tooltipTime">11:15 am</span>
                            <strong class="tooltip-temp" id="tooltipTemp">17°</strong>
                        </div>
                        <svg id="tempCurveSvg" viewBox="0 0 360 110" preserveAspectRatio="none">
                            <defs>
                                <linearGradient id="curveGradient" x1="0" y1="0" x2="0" y2="1">
                                    <stop offset="0%" class="grad-start"/>
                                    <stop offset="100%" class="grad-end"/>
                                </linearGradient>
                            </defs>
                            <path id="curveArea" fill="url(#curveGradient)"/>
                            <path id="curveLine" fill="none" stroke-width="2"/>
                            <circle id="activeDot" cx="255" cy="65" r="5" stroke-width="2.5"/>
                        </svg>
                    </div>
                </div>
            </div>

        </div>

        <!-- Bottom Navigation Bar (Mobile App View) -->
        <nav class="bottom-nav">
            <button class="nav-item active" data-page="home">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                <span>Home</span>
            </button>
            <button class="nav-item" data-page="search">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                <span>Search</span>
            </button>
            <button class="nav-item" data-page="analytics">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 20V10"/><path d="M12 20V4"/><path d="M6 20v-6"/></svg>
                <span>Analytics</span>
            </button>
            <button class="nav-item" data-page="settings">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                <span>Settings</span>
            </button>
        </nav>

    </div>

    <script src="script.js"></script>
</body>
</html>
